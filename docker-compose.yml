services:
  neo4j:
    image: neo4j:5
    container_name: kg
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./resources:/var/lib/neo4j/resources
    environment:
      NEO4J_AUTH: neo4j/cvkgdemo

  api:
    build:
      context: ./backend
    container_name: kg-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: cvkgdemo
    depends_on:
      - neo4j